name: Build

permissions:
  contents: read # access to check out code and install dependencies

on:
  push:

jobs:
  build:
    runs-on: windows-2025-vs2026

    steps:
    - uses: actions/checkout@v5

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
      with:
        vs-version: '[18,]'

    - name: Build
      run: msbuild MonkeyIslandSpecialEditionSpriteEditor/MonkeyIslandSpecialEditionSpriteEditor.sln -p:Configuration=Release -t:build -restore

    - name: Test
      run: dotnet test MonkeyIslandSpecialEditionSpriteEditor/MonkeyIslandSpecialEditionSpriteEditor.sln -c Release --no-build
