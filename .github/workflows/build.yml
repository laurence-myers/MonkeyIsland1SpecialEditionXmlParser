name: Build

permissions:
  contents: read # access to check out code and install dependencies

on:
  push:

jobs:
  build:
    runs-on: windows-2025-vs2026

    steps:
    - uses: actions/checkout@v5

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # Stamps today's date as the version, builds the solution and the in-game hot-reload tools
    # (se-file-hook, 32-bit C compiled with the runner's Visual Studio C++ toolset), runs the tests,
    # and packages everything into artifacts/MISESE_<yyyy-MM-dd>.zip.
    - name: Build, test and package
      shell: pwsh
      run: |
        ./build.ps1
        $zip = Get-ChildItem artifacts/MISESE_*.zip | Select-Object -First 1
        "PACKAGE_NAME=$($zip.BaseName)" | Out-File -FilePath $env:GITHUB_ENV -Append

    - name: Upload package
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PACKAGE_NAME }}
        path: artifacts/MISESE_*.zip
        if-no-files-found: error
